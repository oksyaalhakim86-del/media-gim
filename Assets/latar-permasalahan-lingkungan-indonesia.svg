<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi permasalahan lingkungan hidup di Indonesia</title>
  <desc id="desc">Panorama kartun bernuansa oranye, hitam, dan kuning yang menampilkan hutan gundul, kebakaran, sungai tercemar sampah, serta asap industri tanpa gambar manusia.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17120f"/>
      <stop offset="0.48" stop-color="#9e3f19"/>
      <stop offset="1" stop-color="#f7a928"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#152d2b"/>
      <stop offset="0.5" stop-color="#245d58"/>
      <stop offset="1" stop-color="#102220"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191514" stop-opacity=".95"/>
      <stop offset="1" stop-color="#544039" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1.2" fill="#ffd15a" opacity=".16"/>
      <circle cx="22" cy="25" r="1" fill="#ffda72" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1260" cy="235" r="118" fill="#ffd34e" opacity=".92"/>
  <circle cx="1260" cy="235" r="154" fill="none" stroke="#ffbd36" stroke-width="5" opacity=".34"/>
