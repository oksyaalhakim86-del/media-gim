<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Permasalahan Lingkungan Hidup di Indonesia</title>
  <desc id="desc">Judul tiga baris bergaya lettering 3D oranye-merah dengan outline dan bayangan, tanpa latar putih.</desc>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbd45"/>
      <stop offset="0.48" stop-color="#f0782e"/>
      <stop offset="1" stop-color="#bb3b25"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f2d23"/>
      <stop offset="1" stop-color="#4a1c20"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="5" flood-color="#050b12" flood-opacity=".72"/>
    </filter>
  </defs>
  <g text-anchor="middle" font-family="Trebuchet MS, DejaVu Sans, sans-serif" font-weight="900" stroke-linejoin="round" paint-order="stroke fill" filter="url(#softShadow)">
    <g fill="url(#side)" stroke="#321820" stroke-width="24" transform="translate(0 14)">
      <text x="600" y="145" font-size="104" transform="rotate(-2 600 145)">PERMASALAHAN</text>
      <text x="600" y="295" font-size="94" transform="rotate(1 600 295)">LINGKUNGAN HIDUP</text>
      <text x="600" y="440" font-size="106" transform="rotate(-1 600 440)">DI INDONESIA</text>
    </g>
    <g fill="url(#front)" stroke="#fff0c2" stroke-width="16">
      <text x="600" y="145" font-size="104" transform="rotate(-2 600 145)">PERMASALAHAN</text>
      <text x="600" y="295" font-size="94" transform="rotate(1 600 295)">LINGKUNGAN HIDUP</text>
      <text x="600" y="440" font-size="106" transform="rotate(-1 600 440)">DI INDONESIA</text>
    </g>
    <g fill="none" stroke="#fff8da" stroke-width="3" opacity=".72">
      <text x="600" y="139" font-size="104" transform="rotate(-2 600 139)">PERMASALAHAN</text>
      <text x="600" y="289" font-size="94" transform="rotate(1 600 289)">LINGKUNGAN HIDUP</text>
      <text x="600" y="434" font-size="106" transform="rotate(-1 600 434)">DI INDONESIA</text>
    </g>
  </g>
</svg>
